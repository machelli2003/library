services:
  # ── Backend Web Service ──────────────────────────────────────────────────
  - type: web
    name: library-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 run:app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false                # You enter this manually in the Render dashboard
      - key: CORS_ORIGINS
        sync: false                # Set to your frontend URL, e.g. https://library-frontend.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Frontend Static Site ─────────────────────────────────────────────────
  - type: web
    name: library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false                # Set to your backend URL, e.g. https://library-backend.onrender.com/api
