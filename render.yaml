services:
  # ── Backend Web Service ──────────────────────────────────────────────────
  - type: web
    name: library-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread -w 1 --threads 8 run:app
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false                # Enter your MongoDB Atlas URI in the Render dashboard
      - key: CORS_ORIGINS
        value: https://muna-library.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Frontend Static Site ─────────────────────────────────────────────────
  - type: web
    name: library-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://muna-librarybackend.onrender.com/api
